<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vaccination Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-8">

    <!-- Enterprise Navigation Bar -->
    <nav class="bg-emerald-800 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-cow text-2xl"></i>
                    <span class="font-bold text-xl tracking-wide">MahaPashu Portal</span>
                </div>
                <div class="hidden md:flex space-x-8 font-medium text-sm">
                    <a href="/" class="hover:text-emerald-200 transition"><i class="fa-solid fa-stethoscope mr-1"></i> Triage</a>
                    <a href="/vaccines" class="hover:text-emerald-200 transition"><i class="fa-solid fa-syringe mr-1"></i> Vaccines</a>
                    <a href="/tele-vet" class="hover:text-emerald-200 transition"><i class="fa-solid fa-user-doctor mr-1"></i> Tele-Vet</a>
                    <a href="/admin" class="hover:text-emerald-200 transition"><i class="fa-solid fa-chart-pie mr-1"></i> Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Scheduling Form -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-green-600">
            <h2 class="text-xl font-bold mb-4">📅 Register Newborn Animal</h2>
            <form id="scheduleForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Animal Tag ID</label>
                    <input type="text" id="animal_tag" placeholder="e.g., TAG-9021" class="w-full border p-2 rounded mt-1" required>
                </div>
                <div>
                    <label class="block text-sm font-medium">Date of Birth</label>
                    <input type="date" id="birth_date" class="w-full border p-2 rounded mt-1" required>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white font-bold px-4 py-2 rounded hover:bg-green-700">Generate Schedule</button>
            </form>
        </div>

        <!-- Upcoming Vaccines Table -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-600">
            <h2 class="text-xl font-bold mb-4">💉 Upcoming Injections</h2>
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="bg-blue-50">
                        <th class="p-2">Tag ID</th>
                        <th class="p-2">Vaccine</th>
                        <th class="p-2">Scheduled Date</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in schedules %}
                    <tr class="border-b">
                        <td class="p-2 font-mono">{{ item.animal_tag }}</td>
                        <td class="p-2">{{ item.vaccine_name }}</td>
                        <td class="p-2 font-semibold text-red-600">{{ item.scheduled_date }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('animal_tag', document.getElementById('animal_tag').value);
            formData.append('birth_date', document.getElementById('birth_date').value);

            await fetch('/api/schedule', { method: 'POST', body: formData });
            window.location.reload(); // Refresh the page to see the new dates
        });
    </script>
    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-400 text-center py-4 text-xs mt-12 w-full">
        <p>&copy; 2026 Smart India Hackathon Prototype | SIH26128</p>
    </footer>
</body>
</html>
